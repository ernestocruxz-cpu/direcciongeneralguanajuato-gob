<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listado de autos</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <script defer src="../js/admin-listado.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <section class="admin-user-menu" aria-label="Sesion de usuario">
        <details>
          <summary>
            <span>Usuario</span>
            <strong data-user-name>Usuario</strong>
          </summary>
          <button class="logout-button" type="button" data-logout>Cerrar sesion</button>
        </details>
      </section>
      <div>
        <p>Modulo interno</p>
        <h1>Listado de autos dados de alta</h1>
        <nav class="admin-nav" aria-label="Navegacion interna">
          <a href="alta.html">Alta de auto</a>
          <a class="active" href="listado.html">Listado</a>
        </nav>
      </div>
    </header>

    <main class="list-main">
      <section class="admin-panel list-panel">
        <div class="list-toolbar">
          <div class="panel-title">
            <span>Registros capturados</span>
            <p id="record-count">0 autos dados de alta.</p>
          </div>

          <div class="list-actions">
            <input id="search-records" type="search" placeholder="Buscar por folio, marca, linea, propietario o serie" />
            <input id="created-date-filter" type="date" aria-label="Filtrar por fecha de registro" />
            <select id="page-size" aria-label="Registros por pagina">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <button id="clear-search" class="secondary-button" type="button">Limpiar</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="records-table">
            <thead>
              <tr>
                <th>Folio</th>
                <th>Registro</th>
                <th>Expedicion</th>
                <th>Vencimiento</th>
                <th>Marca</th>
                <th>Linea</th>
                <th>Ano</th>
                <th>Color</th>
                <th>Propietario</th>
                <th>Serie</th>
                <th>Motor</th>
                <th>PDF</th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
        </div>

        <div id="empty-state" class="empty-state">
          No hay autos dados de alta todavia.
        </div>

        <div class="pagination-bar" aria-label="Paginacion del listado">
          <button id="prev-page" class="secondary-button" type="button">Anterior</button>
          <span id="page-status">Pagina 1 de 1</span>
          <button id="next-page" class="secondary-button" type="button">Siguiente</button>
        </div>
      </section>
    </main>
  </body>
</html>
