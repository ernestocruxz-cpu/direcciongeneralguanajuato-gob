<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login interno</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <script defer src="../js/admin-login.js"></script>
  </head>
  <body class="admin-page login-page">
    <main class="login-shell">
      <section class="login-card">
        <img src="../assets/logo-gobierno.png" alt="Gobierno Secretaria de Gobierno" />
        <p class="login-kicker">Acceso interno</p>
        <h1>Modulo administrativo</h1>

        <form id="login-form" class="login-form">
          <label>
            Correo
            <input name="email" type="email" autocomplete="username" required />
          </label>

          <label>
            Contrasena
            <input name="contrasena" type="password" autocomplete="current-password" required />
          </label>

          <button class="primary-button" type="submit">Ingresar</button>
          <p id="login-message" class="login-message" aria-live="polite"></p>
        </form>

        <p class="demo-access">Acceso exclusivo para personal autorizado.</p>
      </section>
    </main>
  </body>
</html>
